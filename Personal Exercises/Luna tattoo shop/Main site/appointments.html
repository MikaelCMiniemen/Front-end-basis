<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunatic Tattoos - Appointments</title>
    <!-- HEADER FONT -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="CSS/style.css" />
    <script defer src="JS/create_elements.js"></script>
    <script defer src="JS/form.js"></script>
    <script defer src="JS/slogans.js"></script>
  </head>
  <body>
    <div class="login-window"></div>
    <header class="hdr"></header>
    <main class="main-appointments">
      <section class="appointments-main-sect">
        <section class="appointments-planner-sect">
          <form class="appointment-planner-form">
            <div class="appointment-input-div appointment-date-div">
              <label class="appointment-label" for="">When would you like to set an appointment?</label>
              <input  class="appointment-input-field appointment-date-input" type="date" />
            </div>
            <div class="appointment-input-div appointment-time-div">
              <label class="appointment-label" for=""
                >At what time would you like to make an appointment?</label
              >
              <input  class="appointment-input-field appointment-time-input" type="time" />
            </div>
            <div class="appointment-input-div appointment-artist-div">
              <label class="appointment-label" for="">Which artist would you like to book?</label>
              <select default=" " class="appointment-artist-select">
                <option value="invalid">- - - -</option>
                <option value="Luna">Luna</option>
                <option value="Greet">Greet</option>
                <option value="Leen">Leen</option>
                <option value="Jan">Jan</option>
              </select>
            </div>
            <div class="appointment-input-div appointment-name-div">
              <label class="appointment-label">What is your name?</label>
              <input  class="appointment-input-field appointment-name-input" type="text">
            </div>
            <div class="appointment-input-div appointment-mail-div">
              <label class="appointment-label">What is your e-mail adress?</label>
              <input  class="appointment-input-field appointment-email-input" type="text" >
            </div>
            <button  class="appointment-send-btn">Send
            </button>
          </form>
        </section>
        <section class="appointments-img-sect">
          <img
            class="appointments-img"
            src="./IMAGES/slide2-home.jpg"
            alt="Image of tattoo"
          />
          <div class="appointments-img-text">
          <h2 class="appointments-img-text-h2"></h2>
          <p class="appointments-img-text-p"></p>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
