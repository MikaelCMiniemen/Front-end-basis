<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunatic Tattoos - Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css">
    <script defer src="JS/slideshow.js"></script>
</head>
<body>
    <header class="hdr-home">
      <nav>
        <ul class="nav-ul">
          <li class="nav-link"><a class="hover-y-up" href="#">HOME</a></li>
          <li class="nav-link">
            <a class="hover-y-up" href="#">APPOINTMENTS</a>
          </li>
          <li class="nav-link"><a class="hover-y-up" href="#">CONTACT</a></li>
        </ul>
      </nav>

      <div class="logo-div">
        <img
          class="logo-icon"
          src="IMAGES/Lunatic-tattoos-logo.png"
          alt="Logo Lunatic Tattoos"
        />
        <h1 class="title">LUNATIC TATTOOS</h1>
      </div>

      <div class="login-div">
        <button class="login-btn hover-y-up">LOG IN</button>
      </div>
    </header>

    <main class="main-home">
      <section class="slideshow-sect">
        <div class="slideshow-display-container">
          <button
            class="hover-y-up slideshow-btn slideshow-btn-left"
            onclick="plusDivs(-1)"
            aria-label="Previous slide"
          >
            &#10094;
          </button>

          <div class="slides-div hover-y-up">
            <img
              class="hover-y-up mySlides active"
              src="IMAGES/slide1-home.jpg"
              alt="Tattoo work 1"
            />
            <img
              class="hover-y-up mySlides"
              src="IMAGES/slide2-home.jpg"
              alt="Tattoo work 2"
            />
            <img
              class="hover-y-up mySlides"
              src="IMAGES/slide3-home.jpg"
              alt="Tattoo work 3"
            />
            <img
              class="hover-y-up mySlides"
              src="IMAGES/slide4-home.jpg"
              alt="Tattoo work 4"
            />
          </div>

          <button
            class="hover-y-up slideshow-btn slideshow-btn-right"
            onclick="plusDivs(1)"
            aria-label="Next slide"
          >
            &#10095;
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
