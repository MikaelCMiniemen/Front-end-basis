<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-Luna's Tattoos</title>
    <!-- <link rel="stylesheet" href="CSS/style.css"> -->
    <link href='https://fonts.googleapis.com/css?family=Cinzel Decorative' rel='stylesheet'>
    <style>
                /* BOX-SIZING */
html {
  -webkit-box-sizing: border-box;
  -moz-box-sizing: border-box;
  box-sizing: border-box;
}
*, *:before, *:after {
  -webkit-box-sizing: inherit;
  -moz-box-sizing: inherit;
  box-sizing: inherit;
  }
html, body {
    margin: 0;
    padding: 0;
    
}
/* BODY STYLe */
body{
    background: #17131C;
    color: #E9E4D8;
}
/* HEADER STYLES */
.hdr-home{
    font-family: "Cinzel Decorative", serif;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #17131C;
    background: linear-gradient(180deg, rgba(23, 19, 28, 1) 0%, 
    rgba(44, 36, 53, 1) 100%);
    box-shadow: 0px 4px 2px 0px rgba(176,141,87,1);
}
/* LIST ITEM STYLE */
li{
  list-style: none;  
}
/* NAVIGATION STYLE */
nav{
    height: fit-content;
    width: 450px;
}
.nav-ul{
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 50px;
}

/* TITLE DIV STYLE */
.logo-div{
    padding-inline: 100px;
    height: fit-content;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    
}
.logo-icon{

    height: 150px;

}
.title{
    margin-inline: auto;
    width: fit-content;
}
/* LOGIN STYLE */
.login-div{
    height: fit-content;
    width: 450px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Cinzel Decorative", serif;
    font-weight: 700;

}
.login-btn{
    height: 50px;
    width: 100px; 
    border-style: none;
    border-bottom: solid;
    border-color: #B08D57;
    background: none;
    color: #E9E4D8;
    font-family: "Cinzel Decorative", serif;
    font-weight: 700;
    font-size: 1;

}
.hover-color:hover{
    transform: translate(0, -2px); 
    background: linear-gradient(180deg, rgb(66, 54, 80, 0.2) 0%, 
    rgba(66, 54, 80) 100%);
    cursor: pointer;
    border-radius: 15px;
}
/* ANCHOR STYLE */
a {
    display: inline-block;
    padding: 12px 20px;
    text-decoration: none;
    border-bottom: 2px solid #B08D57;
    color: inherit;
}


    </style>
</head>
<body>
    <header class="hdr-home">
        <nav>
            <ul class="nav-ul">
                <li class="nav-link"><a class="hover-color" href="#">HOME</a></li>
                <li class="nav-link"><a class="hover-color" href="#">APPOINTMENTS</a></li>
                <li class="nav-link"><a class="hover-color" href="#">CONTACT</a></li>
            </ul>
        </nav>
        <div class="logo-div">
            <img class="logo-icon" src="IMAGES/Firefly_Minimalist luxury logo mark for a premium tattoo studio. A thin elegant crescent moon 210509.png" alt="Logo Lunatic Tattoos">
            <h1 class="title">LUNATIC TATTOOS</h1>
        </div>
        <div class="login-div">
            <button class="login-btn hover-color">Log-in</button>
        </div>
    </header>
    
</body>
</html>
