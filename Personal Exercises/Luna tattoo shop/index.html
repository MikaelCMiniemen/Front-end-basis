<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home-Luna's Tattoos</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Cinzel Decorative"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="hdr-home">
      <nav>
        <ul class="nav-ul">
          <li class="nav-link"><a class="hover-color" href="#">HOME</a></li>
          <li class="nav-link">
            <a class="hover-color" href="#">APPOINTMENTS</a>
          </li>
          <li class="nav-link"><a class="hover-color" href="#">CONTACT</a></li>
        </ul>
      </nav>
      <div class="logo-div">
        <img
          class="logo-icon"
          src="IMAGES/Firefly_Minimalist luxury logo mark for a premium tattoo studio. A thin elegant crescent moon 210509.png"
          alt="Logo Lunatic Tattoos"
        />
        <h1 class="title">LUNATIC TATTOOS</h1>
      </div>
      <div class="login-div">
        <button class="login-btn hover-color">LOG IN</button>
      </div>
    </header>
    <main class="main-home">
      <section class="slideshow-sect">
        <div class="slideshow-display-container">
          <img class="mySlides" src="img_snowtops.jpg" style="width: 100%" />
          <img class="mySlides" src="img_lights.jpg" style="width: 100%" />
          <img class="mySlides" src="img_mountains.jpg" style="width: 100%" />
          <img class="mySlides" src="img_forest.jpg" style="width: 100%" />

          <button
            class="w3-button w3-black w3-display-left"
            onclick="plusDivs(-1)"
          >
            &#10094;
          </button>
          <button
            class="w3-button w3-black w3-display-right"
            onclick="plusDivs(1)"
          >
            &#10095;
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
